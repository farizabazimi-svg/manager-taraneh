  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --gold: #C9A84C;
      --gold-light: #E8C96A;
      --gold-dim: #8B6914;
      --black: #080808;
      --card-bg: #0E0E0E;
      --pearl: #F5EDD8;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      background: #050505;
      min-height: 100vh;
      font-family: 'Raleway', sans-serif;
      color: #fff;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px 40px;
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%, rgba(201,168,76,0.12) 0%, transparent 70%),
        radial-gradient(ellipse 80% 60% at 50% 100%, rgba(201,168,76,0.06) 0%, transparent 60%),
        #050505;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(201,168,76,0.25);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.03), 0 40px 80px rgba(0,0,0,0.8), 0 0 60px rgba(201,168,76,0.08);
      animation: cardIn 0.9s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes cardIn {
      from { opacity:0; transform: translateY(32px) scale(0.97); }
      to   { opacity:1; transform: translateY(0) scale(1); }
    }
    /* HERO */
    .hero {
      position: relative;
      height: 340px;
      overflow: hidden;
    }
    .hero-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
      filter: brightness(0.82) contrast(1.05);
      transition: filter 0.4s;
    }
    .hero:hover .hero-photo { filter: brightness(0.9) contrast(1.05); }
    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 30%, rgba(8,8,8,0.2) 55%, rgba(8,8,8,0.92) 85%, var(--card-bg) 100%);
      pointer-events: none;
    }
    .hero::before {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      z-index: 3;
      opacity: 0.6;
    }
    .hero-logo {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 4;
      width: 88px;
      height: auto;
      opacity: 0.9;
      border-radius: 6px;
      animation: fadeIn 1.2s 0.3s both;
    }
    @keyframes fadeIn {
      from { opacity:0; transform: scale(0.9); }
      to   { opacity:0.9; transform: scale(1); }
    }
    .badge {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 4;
      background: linear-gradient(135deg, var(--gold-dim), var(--gold));
      color: var(--black);
      font-family: 'Raleway', sans-serif;
      font-weight: 700;
      font-size: 9.5px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      padding: 5px 13px;
      border-radius: 20px;
      animation: fadeIn 1.2s 0.4s both;
    }
    .hero-name {
      position: absolute;
      bottom: 20px;
      left: 0; right: 0;
      z-index: 4;
      text-align: center;
      padding: 0 20px;
    }
    .hero-name-fa {
      font-family: 'Vazirmatn', sans-serif;
      font-weight: 700;
      font-size: 28px;
      color: var(--gold-light);
      line-height: 1.15;
      text-shadow: 0 2px 20px rgba(0,0,0,0.9);
    }
    .hero-name-en {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-style: italic;
      font-size: 15px;
      color: rgba(255,255,255,0.75);
      letter-spacing: 3px;
      margin-top: 2px;
      text-transform: uppercase;
      text-shadow: 0 2px 12px rgba(0,0,0,0.8);
    }
    /* DIVIDER */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 28px;
      margin: 22px 0 18px;
    }
    .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,168,76,0.35), transparent);
    }
    .divider-text {
      font-size: 8px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--gold-dim);
      font-family: 'Raleway', sans-serif;
      font-weight: 500;
    }
    /* ROLE */
    .role-section { text-align: center; padding: 0 28px; }
    .role-title {
      font-family: 'Raleway', sans-serif;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 4px;
    }
    .role-subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    /* LOGO */
    .logo-section {
      display: flex;
      justify-content: center;
      padding: 20px 28px 8px;
    }
    .main-logo { width: 180px; height: auto; opacity: 0.95; border-radius: 8px; }

    /* PHONE STRIP */
    .phone-strip {
      text-align: center;
      padding: 4px 28px 18px;
    }
    .phone-number {
      font-family: 'Raleway', sans-serif;
      font-size: 17px;
      font-weight: 300;
      letter-spacing: 2px;
      color: var(--pearl);
      direction: ltr;
      display: inline-block;
    }

    /* ACTION BUTTONS */
    .actions {
      display: flex;
      gap: 10px;
      padding: 0 28px 28px;
      direction: ltr;
    }
    .action-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      padding: 14px 8px;
      border-radius: 14px;
      text-decoration: none;
      border: 1px solid rgba(201,168,76,0.22);
      background: rgba(201,168,76,0.05);
      transition: all 0.25s;
      cursor: pointer;
    }
    .action-btn:hover {
      background: rgba(201,168,76,0.13);
      border-color: rgba(201,168,76,0.5);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(201,168,76,0.15);
    }
    .action-btn:active { transform: translateY(0); }
    .action-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .action-icon svg { width: 20px; height: 20px; }
    .action-icon.call { background: rgba(52,199,89,0.15); }
    .action-icon.call svg { fill: #34C759; }
    .action-icon.whatsapp { background: rgba(37,211,102,0.15); }
    .action-icon.whatsapp svg { fill: #25D366; }
    .action-icon.save { background: rgba(201,168,76,0.15); }
    .action-icon.save svg { fill: var(--gold); }
    .action-label {
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      font-family: 'Raleway', sans-serif;
    }

    /* QR CODE FOOTER */
    .qr-footer {
      border-top: 1px solid rgba(201,168,76,0.12);
      padding: 22px 28px 24px;
      display: flex;
      align-items: center;
      gap: 18px;
      direction: ltr;
    }
    .qr-wrapper {
      flex-shrink: 0;
      padding: 8px;
      background: #fff;
      border-radius: 10px;
      line-height: 0;
    }
    #qrcode canvas, #qrcode img {
      display: block;
      width: 80px !important;
      height: 80px !important;
    }
    .qr-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .qr-label {
      font-size: 9px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--gold-dim);
      font-family: 'Raleway', sans-serif;
      font-weight: 600;
    }
    .qr-desc {
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      font-style: italic;
      color: rgba(255,255,255,0.4);
      line-height: 1.5;
    }

    /* PARTICLES */
    .particles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    .particle {
      position: absolute;
      width: 2px; height: 2px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0;
      animation: float var(--dur) var(--delay) infinite ease-in-out;
    }
    @keyframes float {
      0%   { opacity:0; transform: translateY(100vh) translateX(0); }
      20%  { opacity:0.4; }
      80%  { opacity:0.15; }
      100% { opacity:0; transform: translateY(0) translateX(var(--drift)); }
    }
    @media (max-width: 440px) {
      .hero { height: 300px; }
      .hero-name-fa { font-size: 24px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .card, .hero-logo, .badge, .particle { animation: none; transition: none; }
    }
  </style>
</head>
